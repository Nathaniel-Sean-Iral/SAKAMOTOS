<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Sakamoto's</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="form-card">
      <h2>Create account</h2>
      <form id="register-form">
        <div class="field">
          <label for="register-username">Username</label>
          <input id="register-username" name="username" type="text" placeholder="Username" required />
        </div>
        <div class="field">
          <label for="register-email">Email</label>
          <input id="register-email" name="email" type="email" placeholder="Email" required />
        </div>
        <div class="field">
          <label for="register-password">Password</label>
          <input id="register-password" name="password" type="password" placeholder="Password" required />
        </div>
        <button class="primary-btn" type="submit" style="width: 100%;">Register</button>
        <div id="register-message" style="margin-top: 14px; color: var(--primary); text-align: center;"></div>
      </form>
      <div class="auth-links">
        <a href="/login">Already have an account?</a>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
